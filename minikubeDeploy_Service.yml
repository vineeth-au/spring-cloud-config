apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-config-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-config-test
  template:
    metadata:
      labels:
        app: spring-config-test
    spec:
      containers:
        - name: spring-config-test
          image: vineethmadhu/spring-config-test:latest
          env:
            - name: spring_profiles_active
              value: dev
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: spring-config-test
spec:
  selector:
    app: spring-config-test
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: NodePort
  